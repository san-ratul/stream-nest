[package]
name = "streamnest"
version = "0.1.0"
description = "StreamNest - privacy-first desktop media streaming application"
edition = "2021"
rust-version = "1.77"

[lib]
name = "streamnest_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
